name: No env files

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  no-env-files:
    name: PR adds no env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A new branch's first push has an all-zero "before"; scope it to the branch's own commits.
      - name: Resolve commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
            range="$base..HEAD"
          else
            range="$BEFORE_SHA..HEAD"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      # Enforced here as well as locally, because a local hook can be skipped.
      - name: Refuse env and key files added or changed
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          blocked=$(git diff --name-only --diff-filter=ACMR "$RANGE" \
            | grep -E '(^|/)\.env($|\.)|(^|/)\.envrc$|\.pem$|\.key$|\.p12$|\.pfx$|(^|/)id_rsa|(^|/)id_ed25519|\.keystore$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$blocked" ]; then
            echo "::error::This change adds env or key files, which hold secrets. Only .env.example may be committed:"
            echo "$blocked"
            exit 1
          fi
          echo "No env or key files in this change."

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan the same range for leaked secrets
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: ./gitleaks detect --source . --log-opts="$RANGE" --redact --exit-code 1
