[project]
name = "trailblazer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Malaika Noor", email = "malaika@aidenrisk.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-openai>=1.6.0",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.11",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
trailblazer = "trailblazer.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
