[project]
name = "trailblazer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Malaika Noor", email = "malaika@aidenrisk.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
trailblazer = "trailblazer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
