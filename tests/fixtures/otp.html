<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Verify your identity</title></head>
<body>
<h1>Check your email</h1>
<p>We sent a 6-digit code to a•••@aidenrisk.com.</p>
<form id="otp-form" method="post" action="#">

  <!-- credential: otp, by autocomplete="one-time-code" -->
  <label for="code">Verification code</label>
  <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required>

  <!-- a button whose text contains "code": must not be mistaken for the forward control -->
  <button type="button" id="resend">Resend code</button>
  <button type="submit" id="verify">Verify</button>
</form>
</body>
</html>
