services:
  db:
    container_name: trailblazer-db
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trailblazer
    ports:
      - "15434:5432"
    volumes:
      - trailblazer_pgdata:/var/lib/postgresql/data
      - ./schema-vertical-carrier.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trailblazer_pgdata:
